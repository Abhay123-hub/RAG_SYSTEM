version: 1
disable_existing_loggers: false
formatters:
  json:
    (): src.core.logger.JsonFormatter
handlers:
  console:
    class: logging.StreamHandler
    formatter: json
    level: INFO
  app_file:
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: logs/app.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    level: INFO
  error_file:
    class: logging.handlers.RotatingFileHandler
    formatter: json
    filename: logs/error.log
    maxBytes: 10485760
    backupCount: 5
    encoding: utf-8
    level: WARNING
root:
  level: INFO
  handlers: [console, app_file, error_file]